name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/napl/**'
      - '.claude/**'
      - 'ARCHITECTURE.md'
      - 'RULE_DOC.md'
      - 'RULE_IMP.md'
      - 'RULE_SIM.md'
      - 'pyproject.toml'
      - 'tests/test_agent_doc_names.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/napl/**'
      - '.claude/**'
      - 'ARCHITECTURE.md'
      - 'RULE_DOC.md'
      - 'RULE_IMP.md'
      - 'RULE_SIM.md'
      - 'pyproject.toml'
      - 'tests/test_agent_doc_names.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install NAPL and documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .
      # This pin and the commit recorded in
      # .claude/skills/napl-validate-unarysim/references/mapping.md name one commit;
      # changing either means changing both.
      - name: Check out UnarySim
        uses: actions/checkout@v6
        with:
          repository: diwu1990/UnarySim
          ref: 030423798a4404b1d92e6c76fbc9193e0631fd6c
          path: .unarysim
          fetch-depth: 1
      - name: Check agent-facing documentation names and paths
        env:
          NAPL_UNARYSIM_CLONE: ${{ github.workspace }}/.unarysim
        run: python tests/test_agent_doc_names.py
      - name: Build HTML
        run: sphinx-build -E -a -W --keep-going -b html docs/source docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
