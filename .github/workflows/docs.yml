name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/napl/**'
      - 'ARCHITECTURE.md'
      - 'RULE_DOCS.md'
      - 'RULE_IMP.md'
      - 'RULE_SIM.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/napl/**'
      - 'ARCHITECTURE.md'
      - 'RULE_DOCS.md'
      - 'RULE_IMP.md'
      - 'RULE_SIM.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install NAPL and documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .
      - name: Build HTML
        run: sphinx-build -E -a -W --keep-going -b html docs/source docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
