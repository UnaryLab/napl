- rtl_module: encode
  layer: operation
  sim_module: sim/operation/encode.py
  inputs:
    input: i_input
  outputs:
    spike: o_spike
  parameters:
    WIDTH: "ceil(log2(config['timestep']))"
    FRAC: "ceil(log2(config['timestep'])) + 1"
    # Sequence circuit encode.v instantiates, one per branch of gen_num_seq:
    # `sobol`, `rc`, and `rate` share the Sobol branch at the same dimension,
    # `tc` and `temporal` share the ascending ramp, and the two LFSR forms each
    # have their own. `sys` reaches none of these and is rejected below.
    GENERATOR: "0 if lower(get(config, 'generator', 'sobol')) in ['sobol', 'rc', 'rate'] else (1 if lower(get(config, 'generator', 'sobol')) == 'lfsr' else (2 if lower(get(config, 'generator', 'sobol')) == 'lfsr_ext' else 3))"
    # Feedback tap mask of the default polynomial get_lfsr_seq takes from
    # LFSR().get_fpolyList(m=WIDTH)[0], indexed by WIDTH. gen_encode.py replays
    # every entry against the model sequence, so a wrong row fails the co-sim
    # rather than translating into wrong hardware. The modes that read no taps
    # resolve 0, which keeps a width outside the table from failing the index
    # for them; for the LFSR modes the width bound below is what enforces it.
    TAPS: "[0, 0, 3, 5, 9, 9, 33, 65, 113, 33, 129, 513, 2369][WIDTH] if (lower(get(config, 'generator', 'sobol')) in ['lfsr', 'lfsr_ext'] and WIDTH <= 12) else 0"
    # get_lfsr_seq's default seed is [0]*(width-1) + [1], the state 1, which is
    # also the opening state of the extended cycle. A configuration carrying its
    # own seed is rejected below rather than resolved here.
    SEED: "1"
    # One direction-vector table per Sobol dimension the generator emits, and
    # the simulation class rejects a dimension below one before this resolves.
    # A dimension above four has no table, so it resolves the d1 path: encode.v
    # reads DIRVEC_FILE only for GENERATOR 0, which is rejected below at such a
    # dimension. All four paths are the same length as the module's default,
    # which Verilog string parameter overrides truncate to.
    DIRVEC_FILE: "['vec/encode_dirvec_d1.hex', 'vec/encode_dirvec_d2.hex', 'vec/encode_dirvec_d3.hex', 'vec/encode_dirvec_d4.hex'][get(config, 'dim', 1) - 1] if get(config, 'dim', 1) <= 4 else 'vec/encode_dirvec_d1.hex'"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # WIDTH is ceil(log2(timestep)), so a single-timestep stream asks for a
    # zero-bit counter, which has no hardware form. Two timesteps give one bit.
    - "config['timestep'] >= 2"
    # The simulator draws any Sobol dimension up to 21201, but the RTL holds
    # direction-vector tables for dimensions 1 to 4 only. The other generators
    # draw the same sequence at every dimension and read no table.
    - "get(config, 'dim', 1) <= 4 or GENERATOR != 0"
    # Every generator with a sequence circuit behind it. `sys` is the one legal
    # gen_num_seq generator with no hardware: it is a Mersenne-Twister
    # permutation drawn at construction, which no online circuit reproduces,
    # seeded or not.
    - "lower(get(config, 'generator', 'sobol')) in ['sobol', 'rc', 'rate', 'lfsr', 'lfsr_ext', 'tc', 'temporal']"
    # The LFSR modes resolve their taps from the table above, which runs from
    # WIDTH 2, the narrowest width with a feedback polynomial and the bound
    # get_lfsr_seq itself raises on, to WIDTH 12. Outside that range the mode has
    # no verified tap row, so it is rejected instead of resolving TAPS 0.
    - "lower(get(config, 'generator', 'sobol')) not in ['lfsr', 'lfsr_ext'] or (ceil(log2(config['timestep'])) >= 2 and ceil(log2(config['timestep'])) <= 12)"
    # SEED is the default seed's state. A configuration naming its own seed walks
    # a different cycle, which the resolved parameters would not carry.
    - "lower(get(config, 'generator', 'sobol')) not in ['lfsr', 'lfsr_ext'] or 'seed' not in config"
    # TAPS is the default polynomial's tap mask. A configuration naming its own
    # taps walks a different polynomial, which the resolved parameters would not
    # carry. The other generators read no taps, so the clause is inert for them.
    - "lower(get(config, 'generator', 'sobol')) not in ['lfsr', 'lfsr_ext'] or 'taps' not in config"

- rtl_module: encode_hold
  layer: operation
  sim_module: sim/operation/encode_hold.py
  inputs:
    input: i_input
  outputs:
    output: o_output
  parameters:
    WIDTH: "ceil(log2(config['timestep']))"
    TRIGGER: "config['trigger_timestep']"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # A single-timestep stream sizes the sequence counter at zero bits.
    - "config['timestep'] >= 2"
    # count_k / TRIGGER is exact and the shift reproduces the model only when the
    # trigger is a power of two.
    - "2 ** int(log2(config['trigger_timestep'])) == config['trigger_timestep']"
    # encode_hold.v instantiates encode without overriding its GENERATOR, so the
    # re-emitted stream always walks the Sobol sequence at the default dimension.
    # No parameter carries that choice, so the only configurations with a
    # hardware form are the three names sharing gen_num_seq's Sobol branch.
    - "lower(get(config, 'generator', 'sobol')) in ['sobol', 'rc', 'rate']"

