    input: i_input
    hx: i_hx
    weight_f: i_weight_f
    bias_f: i_bias_f
    weight_n: i_weight_n
    bias_n: i_bias_n
    hx_value: i_hx_value
  outputs:
    output: o_output
  parameters:
    LANES: "config['lanes']"
    # Both gate layers read cat(hidden, input), so the gate width minus the
    # hidden lanes is the input feature count.
    IN_SIZE: "shape(config['weight_f'])[1] - config['lanes']"
    WIDTH: "get(config['config'], 'width', 10)"
    SEQ_WIDTH: "ceil(log2(config['config']['timestep']))"
    SR_WIDTH: "get(config['config'], 'depth_ismul', 6)"
    HAS_BIAS_F: "int(get(config, 'bias_f') is not None)"
    HAS_BIAS_N: "int(get(config, 'bias_n') is not None)"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # A zero-lane layer builds in the simulator, but the RTL has no lane to generate.
    - "LANES >= 1"
    - "shape(config['weight_f'])[0] == config['lanes']"
    - "shape(config['weight_n'])[0] == config['lanes']"
    - "shape(config['weight_n'])[1] == shape(config['weight_f'])[1]"
    - "IN_SIZE >= 1"
    # The lane accumulators are add_scale_*, whose 32-bit elaboration constants cap WIDTH.
    - "WIDTH <= 30"
