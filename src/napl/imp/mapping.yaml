    - "LANES == BATCH * OUT_CHANNELS * ((IN_H + 2 * PADDING - DILATION * (KERNEL_H - 1) - 1) // STRIDE + 1) * ((IN_W + 2 * PADDING - DILATION * (KERNEL_W - 1) - 1) // STRIDE + 1)"

- rtl_module: conv_ugemm_bipolar
  layer: module
  sim_module: sim/module/conv_ugemm.py
  inputs:
    input_spike: i_input_spike
    weight: i_weight
    bias: i_bias
  outputs:
    output: o_out
