# Simulation class -> RTL module bindings, read by napl/syn/translate.py.
# Keys, the allowed `layer` values and its default, the expression language, and
# the generator self-check contract are documented in RULE_IMP.md ("mapping.yaml").
- rtl_module: add_any_bipolar
  layer: operation
  sim_module: sim/operation/add_any.py
  inputs:
    input: i_input
    entry: null
    dim: null
  outputs:
    output: o_out
  parameters:
    SCALE: "config['scale']"
    WIDTH: "config['width']"
    ENTRY: input.size(dim)
  requires:
    - "WIDTH <= 30"
    - "2 ** WIDTH + 3 * ENTRY + 1 <= 2 ** 31 - 1"

- rtl_module: add_any_unipolar
  layer: operation
  sim_module: sim/operation/add_any.py
  inputs:
    input: i_input
    entry: null
    dim: null
  outputs:
    output: o_out
  parameters:
    SCALE: "config['scale']"
    WIDTH: "config['width']"
    ENTRY: input.size(dim)
  requires:
    - "WIDTH <= 30"
    - "2 ** WIDTH + 3 * ENTRY + 1 <= 2 ** 31 - 1"

