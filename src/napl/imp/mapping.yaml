- rtl_module: mul_scale_bipolar
  layer: operation
  sim_module: sim/operation/mul_scale.py
  inputs:
    input: i_input
  outputs:
    output: o_output
  parameters:
    SCALE: "config['scale']"
    WIDTH: "config['intwidth']"
  requires:
    # 2 ** WIDTH is a 32-bit elaboration constant, so cap WIDTH (the RTL guards this too).
    - "config['intwidth'] <= 30"
    # The accumulator counts whole units, so only the integer grid (fracwidth 0)
    # has a hardware form.
    - "config['fracwidth'] == 0"
    # On that grid the model rounds the scale to an integer, so SCALE tracks the
    # request only when it is already integral.
    - "config['scale'] == int(config['scale'])"
    # The datapath sizing assumes the per-spike addend stays below 2 ** (WIDTH - 1).
    - "config['scale'] <= 2 ** (config['intwidth'] - 1) - 1"

