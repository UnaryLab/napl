# Simulation class -> RTL module bindings, read by napl/syn/translate.py.
# Keys, the allowed `layer` values and its default, the expression language, and
# the generator self-check contract are documented in RULE_IMP.md ("mapping.yaml").
- rtl_module: add_gaines
  layer: operation
  sim_module: sim/operation/add_gaines.py
  inputs:
    input: i_input
    dim: null
  outputs:
    output: o_output
  parameters:
    SCALED: "config['scaled']"
    ENTRY: "config['entry']"
    SELECT_WIDTH: "log2(config['entry'])"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # Scaled mode reads its selector sequence from vec/add_gaines_rom.hex, which
    # gen_add_gaines.py generates from its own model configuration: eight rows
    # holding the selector list [0, 4, 6, 2, 3, 7, 5, 1]. No parameter carries
    # the ROM contents, so scaled mode has a hardware form exactly for the
    # configurations whose model draws that same sequence: the three names
    # sharing gen_num_seq's Sobol branch, at entry 8, at a dimension whose first
    # eight Sobol points are that list. `seed` and `taps` reach no Sobol code
    # path, so they stay unrestricted here, and unscaled mode reads no sequence
    # at all.
    - "not config['scaled'] or lower(get(config, 'generator', 'sobol')) in ['sobol', 'rc', 'rate']"
    # add_gaines.v reads the ROM into select_rom[0:ENTRY-1], so an entry above
    # the ROM's eight rows leaves the rows past the eighth X, and an entry below
    # it walks a shorter selector cycle than the model's.
    - "not config['scaled'] or ENTRY == 8"
    # A configuration has a hardware form when its model draws the ROM's
    # selector list, which the clause generates from the model and compares
    # against the list gen_add_gaines.py writes into the ROM.
    - "not config['scaled'] or model_seq('add_gaines', config) == [0, 4, 6, 2, 3, 7, 5, 1]"

- rtl_module: add_scale_bipolar
  layer: operation
  sim_module: sim/operation/add_scale.py
  inputs:
    input: i_input
    entry: null
    dim: null
  outputs:
    output: o_output
  parameters:
    SCALE: "config['scale']"
    WIDTH: "config['intwidth']"
    ENTRY: input.size(dim)
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    - "WIDTH <= 30"
    - "2 ** WIDTH + 3 * ENTRY + 1 <= 2 ** 31 - 1"
    # The RTL accumulator counts whole spikes, so only the integer grid of the
    # simulation model, fracwidth 0, has a hardware form.
    - "config['fracwidth'] == 0"
    # On that grid the simulation model rounds the requested scale to an integer
    # and compares against the rounded value, so SCALE tracks it only when the
    # request is already integral.
    - "config['scale'] == int(config['scale'])"

- rtl_module: add_scale_dyn_bipolar
  layer: operation
  sim_module: sim/operation/add_scale_dyn.py
  inputs:
    input: i_input
    scale: i_scale
    entry: null
    dim: null
  outputs:
    output: o_output
  parameters:
    SCALE_W: "ceil(log2(config['scale_max'] + 1))"
    WIDTH: "config['intwidth']"
    ENTRY: input.size(dim)
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    - "WIDTH <= 30"
    # The accumulator, the scale bus and the reduction all land in one 32-bit
    # elaboration constant, and the Python constructor caps scale_max at
    # 2 ** (WIDTH - 1) - 1, so the scale term is bounded by 2 ** (WIDTH - 1).
    - "2 ** WIDTH + 2 ** (WIDTH - 1) + 3 * ENTRY + 1 <= 2 ** 31 - 1"
    # The RTL accumulator counts whole spikes, so only the integer grid of the
    # simulation model, fracwidth 0, has a hardware form.
    - "config['fracwidth'] == 0"

