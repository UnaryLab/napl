    - "config['hi'] * 2 ** FRACWIDTH == floor(config['hi'] * 2 ** FRACWIDTH + 0.5)"
    # The three constant streams ride Sobol dimensions dim, dim+1, dim+2, whose
    # direction vectors are baked into C0/C1/C2_DIRVEC. No parameter carries the
    # dimension, so only the default 2 the tables were emitted for has a
    # hardware form.
    - "get(config, 'dim', 2) == 2"
    # Those same tables are baked FRACWIDTH + 1 = 9 bits wide, the width of the
    # SEQ_W encoders they feed. No parameter carries the table width, so only the
    # default 8 the tables were emitted for has a hardware form.
    - "get(config, 'fracwidth', 8) == 8"

- rtl_module: clamp_sat_dyn
  layer: operation
  sim_module: sim/operation/clamp_sat_dyn.py
  inputs:
    input: i_input
    lo: i_lo
    hi: i_hi
  outputs:
    output: o_output
  # One module serves both polarities and nothing here is configuration-dependent:
  # the band arrives on the two bound ports, and the stage shape the RTL is built
  # around (unit scale, the integer grid, the 3/5/3 entry counts, and the stage
  # accumulator width) is fixed in the simulation class rather than read from its
  # config, whose only key is the polarity. So every clamp_sat_dyn configuration has
  # this hardware form and no requires clause restricts it. The stage accumulator
  # width reaches WIDTH, which the RTL defaults to the model's 4 and which carries
  # add_scale_bipolar's own 32-bit elaboration guard.

- rtl_module: clamp_comp
  layer: operation
  sim_module: sim/operation/clamp_comp.py
  inputs:
    input: i_input
  outputs:
    output: o_output
  parameters:
    # The simulation class fixes the bound-sequence period at 2**9 rather than
    # reading it from the config, so this literal is the binding to that constant;
    # gen_clamp_comp.py compares it against the model's own constant_len, and a
    # class that moved the period fails the co-simulation here.
    SEQ_W: "9"
    # A bound reaches the encoder as the probability the model thresholds against
    # the sequence: b for a unipolar bound and (b + 1) / 2 for a bipolar one, in
    # units of 2**-SEQ_W. The polarity reaches the circuit only through these two
    # codes, so one bare module serves both.
    LO_CODE: "floor((config['lo'] if config['polarity'] == 'unipolar' else (config['lo'] + 1) / 2) * 2 ** SEQ_W + 0.5)"
    HI_CODE: "floor((config['hi'] if config['polarity'] == 'unipolar' else (config['hi'] + 1) / 2) * 2 ** SEQ_W + 0.5)"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # Each bound's probability must land on the 2**-SEQ_W threshold grid, so the
    # code the encoder compares is the bound itself. Off the grid the model keeps
    # the exact probability and thresholds one sequence point differently, which
    # the rounded parameter cannot express.
    - "(config['lo'] if config['polarity'] == 'unipolar' else (config['lo'] + 1) / 2) * 2 ** SEQ_W == LO_CODE"
    - "(config['hi'] if config['polarity'] == 'unipolar' else (config['hi'] + 1) / 2) * 2 ** SEQ_W == HI_CODE"
    # The two bound streams ride Sobol dimensions dim and dim + 1, whose direction
    # vectors are baked into LO_DIRVEC and HI_DIRVEC. No parameter carries the
    # dimension, so only the default 2 the tables were emitted for has a hardware
    # form.
    - "get(config, 'dim', 2) == 2"

- rtl_module: clamp_comp_dyn
  layer: operation
  sim_module: sim/operation/clamp_comp_dyn.py
  inputs:
    input: i_input
    lo: i_lo
    hi: i_hi
  outputs:
    output: o_output
  parameters: {}
  # One module serves both polarities and nothing here is configuration-dependent:
  # the band arrives on the two bound ports, the two selectors carry no sizing
  # field, and the class config holds only the polarity, which the selectors never
  # read. So every clamp_comp_dyn configuration has this hardware form, the module
  # declares no parameter, and no requires clause restricts it.

