- rtl_module: decorr
  layer: operation
  sim_module: sim/operation/decorr.py
  inputs:
    input_0: i_input_0
    input_1: i_input_1
  outputs:
    output_0: o_output_0
    output_1: o_output_1
  parameters:
    DEPTH: "config['depth']"
    IDX_W: "1 if config['depth'] <= 2 else int(ceil(log2(config['depth'])))"
    SEQ_LEN: "config['timestep']"
    SEQ_W: "1 if config['timestep'] <= 2 else int(ceil(log2(config['timestep'])))"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # Both buffer positions come from vec/decorr_rom.hex, which gen_decorr.py
    # generates from its own model configuration, the `sys` sequences at seeds 7
    # and 8. No parameter carries the ROM contents, so the only configuration
    # with a hardware form is the one whose model draws those same sequences.
    # get_sysrand_seq reads neither `dim` nor `taps`, so both stay unrestricted
    # here.
    - "lower(get(config, 'generator', 'sys')) == 'sys'"
    - "get(config, 'seed', None) == 7"
    # Each ROM word packs the two positions as two IDX_W-bit fields, so the word
    # width follows IDX_W and not the depth: depth 3 reads the same four-bit
    # words. What pins the depth is the ROM contents, positions the generator
    # drew for a depth-4 buffer. decorr.v is parameterized over DEPTH, so this
    # clause pins the current generated instance, regenerable at other depths.
    - "DEPTH == 4"
    # decorr.v reads the ROM into idx_rom[0:SEQ_LEN-1] and wraps its counter at
    # SEQ_LEN, and the model wraps its own index the same way, so the 256 ROM
    # words hold one period of the length-256 sequences. A run of another length
    # draws different sequences, which those words do not carry: a shorter one
    # walks a prefix the model never draws, and a longer one replays these 256
    # positions where the model draws a longer sequence. decorr.v is
    # parameterized over SEQ_LEN, so this clause pins the current generated
    # instance, regenerable at other lengths.
    - "SEQ_LEN == 256"

