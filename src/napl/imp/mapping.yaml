- rtl_module: clamp_sat_bipolar
  layer: operation
  sim_module: sim/operation/clamp_sat.py
  inputs:
    input: i_input
  outputs:
    output: o_output
  parameters:
    FRACWIDTH: "get(config, 'fracwidth', 8)"
    LO: "floor(config['lo'] * 2 ** FRACWIDTH + 0.5)"
    HI: "floor(config['hi'] * 2 ** FRACWIDTH + 0.5)"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # The band bounds must land on the 2^-fracwidth grid so LO and HI are exact integers.
    - "config['lo'] * 2 ** FRACWIDTH == floor(config['lo'] * 2 ** FRACWIDTH + 0.5)"
    - "config['hi'] * 2 ** FRACWIDTH == floor(config['hi'] * 2 ** FRACWIDTH + 0.5)"
    # The three constant streams ride Sobol dimensions dim, dim+1, dim+2, whose
    # direction vectors are baked into C0/C1/C2_DIRVEC. No parameter carries the
    # dimension, so only the default 2 the tables were emitted for has a
    # hardware form.
    - "get(config, 'dim', 2) == 2"
    # Those same tables are baked FRACWIDTH + 1 = 9 bits wide, the width of the
    # SEQ_W encoders they feed. No parameter carries the table width, so only the
    # default 8 the tables were emitted for has a hardware form.
    - "get(config, 'fracwidth', 8) == 8"

