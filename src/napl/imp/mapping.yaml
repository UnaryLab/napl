  layer: module
  sim_module: sim/module/avgpool2d.py
  inputs:
    input_spike: i_input_spike
  outputs:
    output: o_out
  parameters:
    KERNEL_AREA: "area(config['kernel_size'])"
    DIVISOR: "get(config, 'divisor_override') if get(config, 'divisor_override') is not None else KERNEL_AREA"
    LANES: "config['lanes']"
  requires:
    - "get(config, 'padding', 0) in (0, (0, 0))"
    - "get(config, 'stride') is None or get(config, 'stride') == config['kernel_size']"
    - "get(config, 'ceil_mode', False) == False"
    - "get(config, 'count_include_pad', True) == True"
    - "DIVISOR >= KERNEL_AREA"

- rtl_module: conv_bipolar
  layer: module
  sim_module: sim/module/conv.py
  inputs:
    input_spike: i_input_spike
    weight: i_weight
    bias: i_bias
    pad_bits: i_pad_bits
  outputs:
    output: o_out
  parameters:
    BATCH: input.size(0)
    IN_CHANNELS: "shape(config['weight'])[1]"
    IN_H: input.size(2)
    IN_W: input.size(3)
    OUT_CHANNELS: "shape(config['weight'])[0]"
    KERNEL_H: "shape(config['weight'])[2]"
    KERNEL_W: "shape(config['weight'])[3]"
    # int() rejects a per-axis tuple: the RTL geometry is symmetric.
    STRIDE: "int(get(config, 'stride', 1))"
    PADDING: "int(get(config, 'padding', 0))"
    DILATION: "int(get(config, 'dilation', 1))"
    WIDTH: "get(config['config'], 'width', 12)"
    HAS_BIAS: "int(get(config, 'bias') is not None)"
    SCALE: "get(config['config'], 'scale') if get(config['config'], 'scale') is not None else IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    LANES: "config['lanes']"
  requires:
    - "shape(config['weight'])[1] == input.size(1)"
    - "2 ** (WIDTH - 1) > IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    - "LANES == BATCH * OUT_CHANNELS * ((IN_H + 2 * PADDING - DILATION * (KERNEL_H - 1) - 1) // STRIDE + 1) * ((IN_W + 2 * PADDING - DILATION * (KERNEL_W - 1) - 1) // STRIDE + 1)"

- rtl_module: conv_unipolar
  layer: module
  sim_module: sim/module/conv.py
  inputs:
    input_spike: i_input_spike
    weight: i_weight
    bias: i_bias
    pad_bits: i_pad_bits
  outputs:
    output: o_out
  parameters:
    BATCH: input.size(0)
    IN_CHANNELS: "shape(config['weight'])[1]"
    IN_H: input.size(2)
    IN_W: input.size(3)
    OUT_CHANNELS: "shape(config['weight'])[0]"
    KERNEL_H: "shape(config['weight'])[2]"
    KERNEL_W: "shape(config['weight'])[3]"
    # int() rejects a per-axis tuple: the RTL geometry is symmetric.
    STRIDE: "int(get(config, 'stride', 1))"
    PADDING: "int(get(config, 'padding', 0))"
    DILATION: "int(get(config, 'dilation', 1))"
    WIDTH: "get(config['config'], 'width', 12)"
    HAS_BIAS: "int(get(config, 'bias') is not None)"
    SCALE: "get(config['config'], 'scale') if get(config['config'], 'scale') is not None else IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    LANES: "config['lanes']"
  requires:
    - "shape(config['weight'])[1] == input.size(1)"
    - "2 ** (WIDTH - 1) > IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    - "LANES == BATCH * OUT_CHANNELS * ((IN_H + 2 * PADDING - DILATION * (KERNEL_H - 1) - 1) // STRIDE + 1) * ((IN_W + 2 * PADDING - DILATION * (KERNEL_W - 1) - 1) // STRIDE + 1)"

- rtl_module: conv_pc_bipolar
  layer: module
  sim_module: sim/module/conv_pc.py
  inputs:
    input_spike: i_input_spike
    weight: i_weight
    bias: i_bias
    pad_bits: i_pad_bits
  outputs:
    output: o_out
  parameters:
    BATCH: input.size(0)
    IN_CHANNELS: "shape(config['weight'])[1]"
    IN_H: input.size(2)
    IN_W: input.size(3)
    OUT_CHANNELS: "shape(config['weight'])[0]"
    KERNEL_H: "shape(config['weight'])[2]"
    KERNEL_W: "shape(config['weight'])[3]"
    # int() rejects a per-axis tuple: the RTL geometry is symmetric.
    STRIDE: "int(get(config, 'stride', 1))"
    PADDING: "int(get(config, 'padding', 0))"
    DILATION: "int(get(config, 'dilation', 1))"
    HAS_BIAS: "int(get(config, 'bias') is not None)"
    # Bits per lane count; the lane publishes a count bus, not one spike.
    COUNT_W: "ceil(log2(IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS + 1))"
    LANES: "config['lanes']"
  requires:
    - "shape(config['weight'])[1] == input.size(1)"
    - "LANES == BATCH * OUT_CHANNELS * ((IN_H + 2 * PADDING - DILATION * (KERNEL_H - 1) - 1) // STRIDE + 1) * ((IN_W + 2 * PADDING - DILATION * (KERNEL_W - 1) - 1) // STRIDE + 1)"

