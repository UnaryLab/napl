- rtl_module: eq_rc
  layer: operation
  sim_module: sim/operation/eq_rc.py
  inputs:
    input_0: i_input_0
    input_1: i_input_1
  outputs:
    output: o_output
  parameters:
    VALUE_GAIN: "2 if get(config, 'polarity') == 'bipolar' else 1"
    TOL_NUM: "floor(config['tolerance'] * 10 + 0.5)"
    TOL_DEN: "10"
    # The elapsed-timestep counter is sized to hold the run length (one bit of
    # headroom over its bit width), matching the model's timestep counter.
    TW: "floor(log2(len(SEGMENT))) + 2"
  requires:
    # The float tolerance is carried as TOL_NUM/10, exact only on the tenths grid.
    # The RTL relation is invariant to a common factor, so any k/10 tolerance is faithful.
    - "config['tolerance'] * 10 == floor(config['tolerance'] * 10 + 0.5)"

