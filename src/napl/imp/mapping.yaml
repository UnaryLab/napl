- rtl_module: add_ugemm_bipolar
  layer: operation
  sim_module: sim/operation/add_ugemm.py
  inputs:
    input: i_input
    dim: null
  outputs:
    output: o_output
  parameters:
    SCALED: "config['scaled']"
    ENTRY: input.size(dim)
    COUNT_WIDTH: ceil(log2(ENTRY + 1))
    # Non-scaled, the register holds twice the gap between the accumulator and the
    # emitted count, within [-(ENTRY-1)*len(SEGMENT), (ENTRY-1)*len(SEGMENT) + 2].
    ACC_WIDTH: ceil(log2((ENTRY - 1) * len(SEGMENT) + 3)) + 1
  requires:
    # RTL-only: the simulation class clamps its accumulator to the signed width
    # and the RTL does not, so each clause admits only a width the run never
    # reaches. Scaled, the pre-carry sum peaks at 2*ENTRY-1, or at ENTRY when the
    # segment is one step; non-scaled, the gap peaks at ((ENTRY-1)*len(SEGMENT) + 2) / 2.
    - "not config['scaled'] or ENTRY + (ENTRY - 1) * (len(SEGMENT) > 1) <= 2 ** (get(config, 'width', 10) - 1) - 1"
    - "config['scaled'] or (ENTRY - 1) * len(SEGMENT) + 2 <= 2 ** get(config, 'width', 10) - 2"

- rtl_module: add_ugemm_unipolar
  layer: operation
  sim_module: sim/operation/add_ugemm.py
  inputs:
    input: i_input
    dim: null
  outputs:
    output: o_output
  parameters:
    SCALED: "config['scaled']"
    ENTRY: input.size(dim)
    COUNT_WIDTH: ceil(log2(ENTRY + 1))
    # Non-scaled, the register holds twice the gap between the accumulator and the
    # emitted count, within [0, 2*((ENTRY-1)*len(SEGMENT) + 1)].
    ACC_WIDTH: ceil(log2(2 * ((ENTRY - 1) * len(SEGMENT) + 1) + 1)) + 1
  requires:
    # RTL-only: the simulation class clamps its accumulator to the signed width
    # and the RTL does not, so each clause admits only a width the run never
    # reaches. Scaled, the pre-carry sum peaks at 2*ENTRY-1, or at ENTRY when the
    # segment is one step; non-scaled, the gap peaks at (ENTRY-1)*len(SEGMENT) + 1.
    - "not config['scaled'] or ENTRY + (ENTRY - 1) * (len(SEGMENT) > 1) <= 2 ** (get(config, 'width', 10) - 1) - 1"
    - "config['scaled'] or (ENTRY - 1) * len(SEGMENT) + 1 <= 2 ** (get(config, 'width', 10) - 1) - 1"

