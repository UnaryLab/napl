- rtl_module: div_cordiv
  layer: operation
  sim_module: sim/operation/div_cordiv.py
  inputs:
    dividend: i_dividend
    divisor: i_divisor
  outputs:
    output: o_output
  parameters:
    DEPTH: "config['depth']"
    WIDTH: "log2(config['depth'])"
  requires:
    # RTL-only: each clause rejects configurations the simulation class builds.
    # The simulator builds a one-row buffer, but div_cordiv.v's index needs
    # WIDTH >= 1 bits and no co-simulation covers DEPTH 1.
    - "DEPTH >= 2"
    # The history index is hardwired in div_cordiv.v as the bit-reversed gray
    # code of the cyclic counter, which is the Sobol sequence at dimension 1.
    # No parameter carries the sequence, so the only configurations with a
    # hardware form are the ones whose model draws that same sequence: the three
    # names sharing gen_num_seq's Sobol branch, at a dimension whose first DEPTH
    # points reproduce that index order. The clause below generates the model's
    # sequence and compares it against the index order div_cordiv.v's gates
    # build, so it admits every such dimension at every depth. Dimension 1 does
    # so at every depth, and the buffer holds DEPTH points only, so shallow
    # buffers admit more dimensions: at depth 2 every dimension does, since
    # every Sobol dimension opens 0 then 0.5. `seed` and `taps` reach no Sobol
    # code path, so they stay unrestricted here.
    - "lower(get(config, 'generator', 'sobol')) in ['sobol', 'rc', 'rate']"
    - "model_seq('div_cordiv', config) == gray_index(DEPTH)"

