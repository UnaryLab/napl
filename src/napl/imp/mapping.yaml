    - "2 ** WIDTH + 2 ** (WIDTH - 1) + 3 * ENTRY + 1 <= 2 ** 31 - 1"
    # The RTL accumulator counts whole spikes, so only the integer grid of the
    # simulation model, fracwidth 0, has a hardware form.
    - "config['fracwidth'] == 0"

- rtl_module: add_scale_unipolar
  layer: operation
