    BATCH: input.size(0)
    IN_CHANNELS: "shape(config['weight'])[1]"
    IN_H: input.size(2)
    IN_W: input.size(3)
    OUT_CHANNELS: "shape(config['weight'])[0]"
    KERNEL_H: "shape(config['weight'])[2]"
    KERNEL_W: "shape(config['weight'])[3]"
    # int() rejects a per-axis tuple: the RTL geometry is symmetric.
    STRIDE: "int(get(config, 'stride', 1))"
    PADDING: "int(get(config, 'padding', 0))"
    DILATION: "int(get(config, 'dilation', 1))"
    SEQ_WIDTH: "ceil(log2(config['config']['timestep']))"
    WIDTH: "get(config['config'], 'width', 12)"
    HAS_BIAS: "int(get(config, 'bias') is not None)"
    SCALE: "get(config['config'], 'scale') if get(config['config'], 'scale') is not None else IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    LANES: "config['lanes']"
  requires:
    - "shape(config['weight'])[1] == input.size(1)"
    - "2 ** (WIDTH - 1) > IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    - "LANES == BATCH * OUT_CHANNELS * ((IN_H + 2 * PADDING - DILATION * (KERNEL_H - 1) - 1) // STRIDE + 1) * ((IN_W + 2 * PADDING - DILATION * (KERNEL_W - 1) - 1) // STRIDE + 1)"
    # The lane accumulator is add_any_*, whose 32-bit elaboration constants cap WIDTH.
    - "WIDTH <= 30"

- rtl_module: conv_ugemm_unipolar
  layer: module
  sim_module: sim/module/conv_ugemm.py
  inputs:
    input_spike: i_input_spike
    weight: i_weight
    bias: i_bias
  outputs:
    output: o_out
  parameters:
    BATCH: input.size(0)
    IN_CHANNELS: "shape(config['weight'])[1]"
    IN_H: input.size(2)
    IN_W: input.size(3)
    OUT_CHANNELS: "shape(config['weight'])[0]"
    KERNEL_H: "shape(config['weight'])[2]"
    KERNEL_W: "shape(config['weight'])[3]"
    # int() rejects a per-axis tuple: the RTL geometry is symmetric.
    STRIDE: "int(get(config, 'stride', 1))"
    PADDING: "int(get(config, 'padding', 0))"
    DILATION: "int(get(config, 'dilation', 1))"
    SEQ_WIDTH: "ceil(log2(config['config']['timestep']))"
    WIDTH: "get(config['config'], 'width', 12)"
    HAS_BIAS: "int(get(config, 'bias') is not None)"
    SCALE: "get(config['config'], 'scale') if get(config['config'], 'scale') is not None else IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    LANES: "config['lanes']"
  requires:
    - "shape(config['weight'])[1] == input.size(1)"
    - "2 ** (WIDTH - 1) > IN_CHANNELS * KERNEL_H * KERNEL_W + HAS_BIAS"
    - "LANES == BATCH * OUT_CHANNELS * ((IN_H + 2 * PADDING - DILATION * (KERNEL_H - 1) - 1) // STRIDE + 1) * ((IN_W + 2 * PADDING - DILATION * (KERNEL_W - 1) - 1) // STRIDE + 1)"
    # The lane accumulator is add_any_*, whose 32-bit elaboration constants cap WIDTH.
    - "WIDTH <= 30"

