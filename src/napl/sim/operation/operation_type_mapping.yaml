# Data-only taxonomy mapping each operation group to its member operation names.
add: [add_desync, add_gaines, add_scale, add_scale_dyn, add_ugemm]
clamp: [clamp]
compare: [eq_rc, gt_rc, lt_rc]
convert: [bi2uni, uni2bi]
div: [div_cordiv, div_gaines, div_iscb, div_scale, div_scale_dyn]
exp: [exp_n1, exp_n2g]
inhibit: [inhibit]
log: [log_n1]
logic: [and_corr, or_sat]
max: [max_rc, max_sync, max_tc]
min: [min_rc, min_sync, min_tc]
mul: [mul_gaines, mul_scale, mul_ugemm, mul_ugemm_dyn, mul_unibi, mul_unibi_mux]
mux: [mux_select]
negate: [negate]
pow: [pow_n]
relu: [relu_cnt, relu_sat, relu_shiftreg, relu_tc]
sequential: [counter, dff, jkff, sample_hold, shiftreg]
sigmoid: [sigmoid_hard]
signabs: [signabs, signabs_interleave, signabs_shiftreg]
sqrt: [sqrt_emit, sqrt_gaines, sqrt_traceiscb, sqrt_tracejkff]
square: [square_dff]
sub: [sub_scale, subabs]
sync: [decorr, desync, sync, sync_skewed]
tanh: [tanh_hard, tanh_p1, tanh_pn]
wta: [wta]
