# Data-only taxonomy mapping each operation group to its member operation names.
add: [add_gaines, add_scale, add_scale_dyn, add_ugemm]
clamp: [clamp_comp, clamp_comp_dyn, clamp_sat, clamp_sat_dyn]
compare: [eq, gt, lt]
convert: [bi2uni, uni2bi]
div: [div_cordiv, div_gaines, div_iscb, div_scale, div_scale_dyn]
exp: [exp_m1_delay, exp_m1_regen, exp_n1, exp_n2g]
inhibit: [inhibit_tc]
log: [log_n1]
max: [argmax, max, max_sync, max_tc]
min: [argmin, min, min_sync, min_tc]
mul: [mul_gaines, mul_scale, mul_ugemm, mul_ugemm_regen, mul_unibi, mul_unibi_mux]
mux: [mux_select]
negate: [negate]
pow: [pow_delay, pow_regen]
relu: [relu_cnt, relu_delay, relu_sat, relu_tc]
sequential: [delay, encode_hold, jkff]
sigmoid: [sigmoid_hard]
signabs: [signabs, signabs_delay, signabs_interleave]
sqrt: [sqrt_emit, sqrt_gaines, sqrt_traceiscb, sqrt_tracejkff]
sub: [sub_scale, subabs]
sync: [decorr, desync, encode_cond, encode_regen, sync, sync_skewed]
tanh: [tanh_hard, tanh_p1, tanh_pn]
wta: [wta_tc]
